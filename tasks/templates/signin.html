{% extends 'base.html' %}

{% block content %}
<main class="container">
    <div class="row">
        <div class="col-md-4 offset-md-4 mt-5">
            <form action="{% url 'signin' %}" method="POST" class="card card-body shadow-sm">
                <h1 class="text-center mb-4">Signin</h1>

                {{ error }}
                {% if error %}
                    <p class="alert alert-danger">{{ error }}</p>
                {% endif %}

                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Write your username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Write your password" required>
                </div>

                <button class="btn btn-secondary w-100">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
