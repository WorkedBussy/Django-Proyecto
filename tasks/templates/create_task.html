{% extends 'base.html' %}

{% block content %}
<main class="container">
    <div class="row">
        <div class="col-md-4 offset-md-4 mt-5">
            <form action="{% url 'create_task' %}" method="POST" class="card card-body shadow-sm">
                <h1 class="text-center mb-4">Create Task</h1>

                {{ error }}
                {% if error %}
                    <p class="alert alert-danger">{{ error }}</p>
                {% endif %}

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary w-100 mt-2">
                    Save
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
